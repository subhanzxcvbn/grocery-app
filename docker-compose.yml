services:
  frontend:
    image: YOUR_DOCKERHUB_USERNAME/grocery-frontend:latest
    container_name: grocery-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: YOUR_DOCKERHUB_USERNAME/grocery-backend:latest
    container_name: grocery-backend
    ports:
      - "3000:5000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
    restart: unless-stopped
