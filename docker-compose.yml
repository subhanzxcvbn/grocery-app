
services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: grocery-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: grocery-backend
    ports:
      - "3000:5000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
    restart: unless-stopped

